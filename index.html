<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quầy Hàng Đà Lạt</title>
<style>
  :root { --panel: rgba(255,255,255,.35); --edge: rgba(255,255,255,.7); --ink: #1d2b3a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); touch-action: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .glass { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); box-shadow: 0 6px 18px rgba(0,0,0,.12); }
  #hud { position: fixed; top: calc(env(safe-area-inset-top,0px) + 10px); left: 10px; padding: 8px 12px; font-weight: 700; }
  #coins { position: fixed; top: calc(env(safe-area-inset-top,0px) + 10px); right: 10px; padding: 8px 12px; font-weight: 700; }
  #card { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 16px; min-width: 220px; text-align: center; display: none; }
  #card b { display: block; font-size: 16px; margin-bottom: 4px; }
  #card button { margin-top: 8px; padding: 8px 16px; border: 0; border-radius: 10px; background: #e0a526; color: #fff; font-weight: 700; font-size: 14px; }
  #pad { position: fixed; left: 16px; bottom: 16px; width: 130px; height: 130px; border-radius: 50%; }
  #knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.7); pointer-events: none; }
  @media (prefers-color-scheme: dark) { :root { --panel: rgba(30,50,70,.45); --edge: rgba(255,255,255,.2); --ink: #f2f6fa; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="glass">Quảng trường Lâm Viên</div>
<div id="coins" class="glass">Xu: <span id="xu">0</span></div>
<div id="pad" class="glass"><div id="knob"></div></div>
<div id="card" class="glass"><b id="cName"></b><span id="cInfo"></span><div><button id="cBtn">Bán hàng</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe3f5);
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7);
  sun.position.set(40, 60, 30); scene.add(sun);

  // Nền phẳng: quảng trường 180 x 120
  const plaza = new THREE.Mesh(new THREE.PlaneGeometry(180, 120), new THREE.MeshLambertMaterial({ color: 0xc9c4b8 }));
  plaza.rotation.x = -Math.PI / 2; scene.add(plaza);
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x8fb873 }));
  grass.rotation.x = -Math.PI / 2; grass.position.y = -0.05; scene.add(grass);

  // Quầy hàng
  const STALLS = [
    { id: 'mut',  name: 'Mứt Đặc Sản',       x: -36, z: -42, color: 0x8e44ad, price: 500, cost: 60000 },
    { id: 'rong', name: 'Rượu Vang Đà Lạt',  x:   0, z: -42, color: 0x7b1e3a, price: 700, cost: 90000 },
    { id: 'tra',  name: 'Trà Hoa Cao Cấp',   x:  36, z: -42, color: 0x4f9a6e, price: 600, cost: 75000 },
    { id: 'dau',  name: 'Dâu Tây',           x: -20, z:  10, color: 0xe74c3c, price: 300, cost: 20000 },
    { id: 'banh', name: 'Bánh Tráng Nướng',  x:  20, z:  10, color: 0xf39c12, price: 250, cost: 15000 },
  ];
  const stallMeshes = [];
  for (const s of STALLS) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 4), new THREE.MeshLambertMaterial({ color: 0xffffff }));
    body.position.y = 1.5; g.add(body);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(7, 0.5, 5), new THREE.MeshLambertMaterial({ color: s.color }));
    roof.position.y = 3.25; g.add(roof);
    g.position.set(s.x, 0, s.z); g.userData.stall = s;
    scene.add(g); stallMeshes.push(g);
  }

  // Nhân vật: mô hình base2 (GLB có xương), tô màu trang phục theo xương
  const player = new THREE.Group();
  player.position.set(0, 0, 25); scene.add(player);
  const OUTFITS = [
    { shirt: '#9e3d33', pants: '#3b3b40' },
    { shirt: '#2f6fa8', pants: '#2c3e50' },
    { shirt: '#e0b04a', pants: '#5a4a3a' },
    { shirt: '#6b8e4e', pants: '#4a3f35' },
  ];
  const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const SKIN = hexRGB('#e6b98f'), HAIR = hexRGB('#2a1f1a'), SHOE = hexRGB('#efe9dc');
  const comp = (a, i, c) => c === 0 ? a.getX(i) : c === 1 ? a.getY(i) : c === 2 ? a.getZ(i) : a.getW(i);
  function paint(root, outfit){
    const SHIRT = hexRGB(outfit.shirt), PANTS = hexRGB(outfit.pants);
    root.traverse(o => {
      if (!o.isSkinnedMesh) return;
      const geo = o.geometry.clone(); o.geometry = geo;
      const ga = geo.attributes, n = ga.position.count, bones = o.skeleton.bones;
      let y0 = 1e9, y1 = -1e9;
      for (let i = 0; i < n; i++){ const y = ga.position.getY(i); if (y < y0) y0 = y; if (y > y1) y1 = y; }
      const top = y0 + 0.85 * (y1 - y0), col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++){
        let bw = -1, bi = 0;
        for (let c = 0; c < 4; c++){ const w = comp(ga.skinWeight, i, c); if (w > bw){ bw = w; bi = comp(ga.skinIndex, i, c); } }
        const nm = bones[bi] ? bones[bi].name : '', y = ga.position.getY(i);
        let c;
        if (y > top && !/^(LeftHand|RightHand)/.test(nm)) c = HAIR;
        else if (/^(Head|Neck|LeftHand|RightHand)/.test(nm)) c = SKIN;
        else if (/^(LeftFoot|LeftToeBase|RightFoot|RightToeBase)$/.test(nm)) c = SHOE;
        else if (/^(LeftUpLeg|LeftLeg|RightUpLeg|RightLeg|Hips)$/.test(nm)) c = PANTS;
        else c = SHIRT;
        col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
      }
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      o.material = new THREE.MeshLambertMaterial({ vertexColors: true });
    });
  }
  // Đặt mô hình đứng trên mặt đất, cao khoảng 2.4 đơn vị
  function fit(model){
    const box = new THREE.Box3().setFromObject(model), h = box.max.y - box.min.y || 1;
    const s = 2.4 / h; model.scale.setScalar(s);
    model.position.y = -box.min.y * s; model.userData.baseY = model.position.y; return model;
  }
  let playerModel = null; const npcs = [];
  fetch('cast/base2.glb').then(r => r.arrayBuffer()).then(buf => {
    const parse = () => new Promise((res, rej) => new THREE.GLTFLoader().parse(buf, '', res, rej));
    return parse().then(gltf => {
      playerModel = fit(gltf.scene); paint(playerModel, OUTFITS[0]); player.add(playerModel);
      return Promise.all([1, 2, 3, 4].map(k => parse().then(g => {
        const m = fit(g.scene); paint(m, OUTFITS[k % OUTFITS.length]);
        const grp = new THREE.Group(); grp.add(m); grp.position.set(-60 + k * 30, 0, -10 + k * 8); scene.add(grp);
        npcs.push({ g: grp, tx: grp.position.x, tz: grp.position.z, wait: 1 + k });
      })));
    });
  }).catch(e => console.warn('Không tải được nhân vật', e));

  // Điều khiển: bàn phím + joystick ảo
  const keys = {}; let jx = 0, jz = 0, jActive = false;
  addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
  const pad = document.getElementById('pad'), knob = document.getElementById('knob');
  const padCenter = () => { const r = pad.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 }; };
  pad.addEventListener('pointerdown', e => { jActive = true; pad.setPointerCapture(e.pointerId); moveKnob(e); });
  pad.addEventListener('pointermove', e => { if (jActive) moveKnob(e); });
  pad.addEventListener('pointerup', () => { jActive = false; jx = jz = 0; knob.style.transform = ''; });
  function moveKnob(e) {
    const c = padCenter(); let dx = e.clientX - c.x, dy = e.clientY - c.y;
    const d = Math.hypot(dx, dy), m = Math.min(d, c.r * 0.7), k = d ? m / d : 0;
    dx *= k; dy *= k; knob.style.transform = `translate(${dx}px,${dy}px)`;
    jx = dx / (c.r * 0.7); jz = dy / (c.r * 0.7);
  }

  // Chọn quầy: chạm lên quầy hoặc đứng gần
  let coins = 0; let near = null; const owned = {};
  const card = document.getElementById('card');
  document.getElementById('cBtn').addEventListener('click', () => {
    if (!near) return;
    const s = near.userData.stall;
    coins += s.price; document.getElementById('xu').textContent = coins.toLocaleString('vi-VN');
  });

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let mx = jx, mz = jz;
    if (keys['arrowleft'] || keys['a']) mx -= 1;
    if (keys['arrowright'] || keys['d']) mx += 1;
    if (keys['arrowup'] || keys['w']) mz -= 1;
    if (keys['arrowdown'] || keys['s']) mz += 1;
    const len = Math.hypot(mx, mz);
    if (len > 0.05) {
      const sp = 9 * Math.min(1, len);
      player.position.x = THREE.MathUtils.clamp(player.position.x + (mx / len) * sp * dt, -88, 88);
      player.position.z = THREE.MathUtils.clamp(player.position.z + (mz / len) * sp * dt, -58, 58);
      player.rotation.y = Math.atan2(mx, mz);
    }
    if (playerModel){ const moving = len > 0.05; playerModel.position.y = playerModel.userData.baseY + (moving ? Math.abs(Math.sin(now / 120)) * 0.08 : 0); }
    for (const q of npcs){
      const dx = q.tx - q.g.position.x, dz = q.tz - q.g.position.z, d = Math.hypot(dx, dz);
      if (d < 0.3){ q.wait -= dt; if (q.wait <= 0){ q.tx = THREE.MathUtils.randFloat(-80, 80); q.tz = THREE.MathUtils.randFloat(-50, 50); q.wait = THREE.MathUtils.randFloat(2, 5); } }
      else { q.g.position.x += dx / d * 2.2 * dt; q.g.position.z += dz / d * 2.2 * dt; q.g.rotation.y = Math.atan2(dx, dz); }
    }
    // Quầy gần nhất trong 6 đơn vị
    near = null; let best = 6;
    for (const g of stallMeshes) {
      const d = Math.hypot(g.position.x - player.position.x, g.position.z - player.position.z);
      if (d < best) { best = d; near = g; }
    }
    if (near) {
      const s = near.userData.stall;
      document.getElementById('cName').textContent = s.name;
      document.getElementById('cInfo').textContent = `Bán ${s.price.toLocaleString('vi-VN')} xu/phần`;
      card.style.display = 'block';
    } else card.style.display = 'none';

    camera.position.set(player.position.x, 6.5, player.position.z + 10);
    camera.lookAt(player.position.x, 1.5, player.position.z);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__game = { player, STALLS, get coins() { return coins; } };
})();
</script>
</body>
</html>
