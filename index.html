<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quầy Hàng Đà Lạt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen canvas world, game HUD floating at the screen corners like a mobile RPG. Single dark-HUD look by choice. */
:root{
  --panel: rgba(14,28,52,.80);
  --panel-solid:#13233d;
  --edge: rgba(255,255,255,.16);
  --gold:#ffc83d;
  --gold-deep:#d98f0e;
  --gem:#5ad8ff;
  --hp:#5bd25a;
  --xp:#3d9bff;
  --ink:#ffffff;
  --ink-dim:#c4d2e8;
  --danger:#ff6b5e;
  --ok:#7be26b;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme: dark;
  font-size: clamp(10px, calc(1.45vmin + 4px), 16px);
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#9cc4e4;color:var(--ink);font-family:var(--font-body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button *{pointer-events:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--font-display)}
#hud > *{position:absolute;pointer-events:auto}
.T{--t:calc(env(safe-area-inset-top,0px) + .7rem)}
.outline{text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 3px rgba(0,0,0,.6)}

/* profile */
.profile{top:calc(env(safe-area-inset-top,0px) + .6rem);left:calc(env(safe-area-inset-left,0px) + .8rem);display:flex;align-items:center;gap:.6rem}
.avatar{width:4.8rem;height:4.8rem;border-radius:50%;border:.25rem solid #f2f5fa;box-shadow:0 0 0 .2rem #1b2c47,0 .3rem .6rem rgba(0,0,0,.35);overflow:hidden;background:#7cc6f2;flex:none}
.avatar svg{width:100%;height:100%;display:block}
.pinfo{display:flex;flex-direction:column;gap:.25rem;background:linear-gradient(90deg,rgba(14,28,52,.85),rgba(14,28,52,0));padding:.3rem 1.6rem .4rem .5rem;border-radius:.6rem}
.pname{display:flex;gap:.8rem;font-size:1.35rem;font-weight:800;line-height:1}
.pname .lv{color:#f4f7ff}
.bar{width:12rem;height:.8rem;border-radius:1rem;background:rgba(0,0,0,.55);border:.12rem solid rgba(255,255,255,.35);overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:1rem;transition:width .2s}
.bar.hp i{background:linear-gradient(#8cf07a,var(--hp))}
.bar.xp i{background:linear-gradient(#7cc4ff,var(--xp))}

/* money */
.money{top:calc(env(safe-area-inset-top,0px) + 1.4rem);left:calc(env(safe-area-inset-left,0px) + 20.5rem);display:flex;gap:.7rem}
.pill{display:flex;align-items:center;gap:.4rem;height:2.5rem;padding:0 .3rem 0 .25rem;background:var(--panel);border:.12rem solid var(--edge);border-radius:2rem;font-size:1.3rem;font-weight:800}
.pill b{min-width:5.6rem;text-align:center;font-variant-numeric:tabular-nums}
.ico{width:2rem;height:2rem;flex:none;display:block}
.ico.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b8,#ffd23f 40%,#e39b10 75%,#b06f05);box-shadow:inset 0 0 0 .18rem #c98208,inset 0 0 0 .4rem #ffd855}
.ico.gem{background:linear-gradient(135deg,#c9f6ff,#4fd2ff 45%,#1f8fe0 70%,#0d63b8);clip-path:polygon(50% 100%,0 35%,22% 8%,78% 8%,100% 35%);width:2.1rem}
.plus{width:1.6rem;height:1.6rem;border-radius:50%;background:linear-gradient(#ffe27a,var(--gold-deep));color:#4a2d00;display:grid;place-items:center;font-size:1.3rem;line-height:1;box-shadow:inset 0 -.15rem 0 rgba(0,0,0,.2)}

/* top-right menu */
.menu{top:calc(env(safe-area-inset-top,0px) + .5rem);right:calc(env(safe-area-inset-right,0px) + 11.5rem);display:flex;gap:.9rem}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:1.05rem;font-weight:800;position:relative;min-width:4.2rem}
.mbtn svg{width:3.3rem;height:3.3rem;filter:drop-shadow(0 .2rem .15rem rgba(0,0,0,.4))}
.dot{position:absolute;top:.1rem;right:.4rem;width:.9rem;height:.9rem;border-radius:50%;background:var(--danger);border:.15rem solid #fff}

/* minimap */
.minimap{top:calc(env(safe-area-inset-top,0px) + .5rem);right:calc(env(safe-area-inset-right,0px) + .8rem);width:10rem;height:10rem}
.minimap canvas{width:100%;height:100%;border-radius:50%;display:block;border:.3rem solid #1d2c45;box-shadow:0 0 0 .15rem rgba(255,255,255,.6),0 .3rem .6rem rgba(0,0,0,.35);box-sizing:border-box;background:#7fbf5a}
.mm-title{position:absolute;top:-.2rem;left:50%;transform:translateX(-50%);background:#1d2c45;padding:0 1rem;border-radius:1rem;font-size:1.25rem;font-weight:800;white-space:nowrap;z-index:1;border:.1rem solid rgba(255,255,255,.3)}
.mm-n{position:absolute;top:1.5rem;left:50%;transform:translateX(-50%);font-size:1rem;font-weight:800;color:#fff;z-index:1}

/* quest */
.quest{top:calc(env(safe-area-inset-top,0px) + 6.6rem);left:calc(env(safe-area-inset-left,0px) + .8rem);width:17.5rem;background:var(--panel);border:.12rem solid var(--edge);border-radius:1rem;padding:.55rem .8rem .65rem;display:grid;grid-template-columns:1fr auto;gap:.2rem .5rem;align-items:center;text-align:left}
.q-head{grid-column:1/-1;display:flex;align-items:center;gap:.5rem;font-size:1.25rem;font-weight:800;color:var(--gold)}
.bang{width:1.7rem;height:1.7rem;border-radius:.4rem;background:linear-gradient(#ffe27a,#f2a60c);color:#3a2300;display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none}
.q-body{font-family:var(--font-body);font-size:1.05rem;line-height:1.35;color:#eef3fb;min-width:0}
.q-prog{display:block;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.q-go{font-size:2rem;font-weight:800;color:var(--gold);padding:0 .2rem}
.quest.done{border-color:var(--gold);box-shadow:0 0 1rem rgba(255,200,61,.45)}
.quest.done .q-go{font-size:1.1rem;background:linear-gradient(#ffe27a,var(--gold-deep));color:#3a2300;border-radius:.6rem;padding:.3rem .7rem;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}

/* event */
.event{top:calc(env(safe-area-inset-top,0px) + 18.4rem);left:calc(env(safe-area-inset-left,0px) + .8rem);display:flex;align-items:center;gap:.5rem;background:var(--panel);border:.12rem solid var(--edge);border-radius:1rem;padding:.35rem .9rem .35rem .4rem;text-align:left}
.event svg{width:3.2rem;height:3.2rem;flex:none}
.event span{font-size:1.15rem;font-weight:800;line-height:1.05}
.event em{display:block;font-style:normal;font-size:.95rem;color:var(--gold);font-weight:700}
.buffs{top:calc(env(safe-area-inset-top,0px) + 23rem);left:calc(env(safe-area-inset-left,0px) + .8rem);display:flex;flex-direction:column;gap:.3rem;pointer-events:none!important}
.chip{background:rgba(255,200,61,.92);color:#3a2300;font-weight:800;font-size:1rem;border-radius:1rem;padding:.1rem .7rem;width:max-content}

/* truy tìm */
.hunt{top:calc(env(safe-area-inset-top,0px) + 14.2rem);left:calc(env(safe-area-inset-left,0px) + .8rem);width:17.5rem;display:flex;align-items:center;gap:.55rem;background:var(--panel);border:.12rem solid var(--edge);border-radius:1rem;padding:.4rem .7rem;text-align:left}
.hunt svg{width:2.1rem;height:2.1rem;flex:none}
.hunt .ht{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.hunt .ht b{font-size:1.05rem;color:#b9e3ff}
.hunt .ht span{font-family:var(--font-body);font-size:.95rem;color:#eef3fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hunt.done{border-color:var(--gold);box-shadow:0 0 1rem rgba(255,200,61,.45)}
.hunt.done .ht b{color:var(--gold)}
.stamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.stamp{aspect-ratio:3/4;max-width:100%;border-radius:.3rem;background:var(--c,#3a4660);outline:.18em dashed rgba(255,255,255,.8);outline-offset:-.35em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;padding:.4em;text-align:center}
.stamp b{font-family:var(--font-display);font-size:1.5em;line-height:1}
.stamp span{font-size:.72em;line-height:1.2;font-weight:600}
.stamp.miss{background:#26314a;color:var(--ink-dim)}
.ico-item{width:2.2em;height:2.2em;flex:none;display:block}

/* joystick */
.joy{bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);left:calc(env(safe-area-inset-left,0px) + 1.8rem);width:10rem;height:10rem;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.22));border:.18rem solid rgba(255,255,255,.65);box-shadow:0 0 1rem rgba(0,0,0,.25);touch-action:none}
.knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#bcd9f4 45%,#6f9fd0);box-shadow:0 .3rem .6rem rgba(0,0,0,.35)}
.arw{position:absolute;width:0;height:0;border:.55rem solid transparent}
.arw.u{top:.6rem;left:50%;margin-left:-.55rem;border-bottom-color:rgba(255,255,255,.85);border-top:0}
.arw.d{bottom:.6rem;left:50%;margin-left:-.55rem;border-top-color:rgba(255,255,255,.85);border-bottom:0}
.arw.l{left:.6rem;top:50%;margin-top:-.55rem;border-right-color:rgba(255,255,255,.85);border-left:0}
.arw.r{right:.6rem;top:50%;margin-top:-.55rem;border-left-color:rgba(255,255,255,.85);border-right:0}

/* action buttons */
.actions{bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);right:calc(env(safe-area-inset-right,0px) + 1rem);display:flex;align-items:flex-end;gap:.9rem}
.act{width:5.6rem;height:5.6rem;border-radius:50%;background:rgba(18,30,52,.55);border:.18rem solid rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.15rem;font-weight:800;box-shadow:0 .2rem .6rem rgba(0,0,0,.3)}
.act svg{width:2.6rem;height:2.6rem}
.act.big{width:6.8rem;height:6.8rem}
.act.big svg{width:3.4rem;height:3.4rem}
.act.on{background:rgba(255,200,61,.85);color:#3a2300;border-color:#fff3c4}
.act:active{transform:scale(.94)}

/* stall context card */
.ctx{bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);left:50%;transform:translateX(-50%);width:min(27rem,calc(100vw - 27rem));background:var(--panel);border:.15rem solid var(--gold);border-radius:1rem;padding:.6rem .8rem .7rem;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.35)}
.ctx-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-size:1.35rem;font-weight:800}
.ctx-head span{color:var(--gold);font-size:1.1rem}
.ctx-stats{font-family:var(--font-body);font-size:1rem;color:var(--ink-dim);margin:.15rem 0 .5rem;line-height:1.4}
.ctx-stats b{color:#fff;font-variant-numeric:tabular-nums}
.ctx-btns{display:flex;flex-wrap:wrap;gap:.5rem}
.gbtn{flex:1;min-height:3rem;border-radius:.7rem;background:linear-gradient(#ffe27a,var(--gold-deep));color:#3a2300;font-weight:800;font-size:1.15rem;line-height:1.05;padding:.3rem .4rem;box-shadow:inset 0 -.25rem 0 rgba(0,0,0,.18)}
.gbtn small{display:block;font-size:.85rem;font-weight:700;opacity:.85;font-family:var(--font-body)}
.gbtn.blue{background:linear-gradient(#8fd8ff,#2f8ee0);color:#06243f}
.gbtn.green{background:linear-gradient(#a6f08f,#3fae3a);color:#0d2e09}
.gbtn:disabled{background:#56627a;color:#c9d1de;box-shadow:none;cursor:default}
.gbtn.poor{filter:saturate(.35) brightness(.9)}
.gbtn:active:not(:disabled){transform:translateY(.1rem)}

/* toasts */
.toasts{top:calc(env(safe-area-inset-top,0px) + 6rem);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.35rem;pointer-events:none!important;width:min(30rem,90vw)}
.toast{background:rgba(14,28,52,.92);border:.12rem solid var(--edge);border-radius:2rem;padding:.35rem 1rem;font-size:1.15rem;font-weight:700;text-align:center;animation:tin .25s ease-out}
.toast.gold{border-color:var(--gold);color:#ffe7a0}
.toast.bad{border-color:var(--danger);color:#ffd2cd}
@keyframes tin{from{opacity:0;transform:translateY(-.5rem)}}

.rotate{z-index:30;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel-solid);border:.15rem solid var(--gold);border-radius:1rem;padding:1rem 1.2rem;width:min(22rem,80vw);text-align:center;font-size:1.3rem;font-weight:700;font-family:var(--font-body)}
.rotate p{margin:0 0 .8rem;line-height:1.4}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,12,24,.6);display:grid;place-items:center;z-index:5;padding:1rem;font-size:max(13px,1rem)}
.sheet{width:min(32rem,100%);max-height:min(82vh,40rem);display:flex;flex-direction:column;background:var(--panel-solid);border:.15rem solid rgba(255,200,61,.6);border-radius:1.1rem;box-shadow:0 1rem 3rem rgba(0,0,0,.5);overflow:hidden}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;background:linear-gradient(#1f3762,#172a4a);border-bottom:.12rem solid rgba(255,255,255,.1)}
.sheet h2{margin:0;font-family:var(--font-display);font-size:1.6em;color:var(--gold);line-height:1}
.xbtn{width:2.2em;height:2.2em;border-radius:50%;background:rgba(255,255,255,.12);font-size:1.3em;font-weight:700}
.mbody{overflow:auto;padding:.8rem 1rem 1rem;display:flex;flex-direction:column;gap:.6rem}
.mbody h3{margin:.4rem 0 0;font-family:var(--font-display);font-size:1.15em;color:#9fc6ff}
.mbody p{margin:0;line-height:1.5;color:var(--ink-dim)}
.row{display:flex;align-items:center;gap:.8rem;background:rgba(255,255,255,.05);border:.1rem solid rgba(255,255,255,.08);border-radius:.8rem;padding:.6rem .7rem}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:1.02em}
.row .rt span{display:block;color:var(--ink-dim);font-size:.88em;line-height:1.35}
.row .gbtn{flex:none;min-width:6.5em;font-size:.95em;min-height:2.5em}
.pbar{height:.45em;border-radius:1em;background:rgba(0,0,0,.4);margin-top:.35em;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--xp)}
.sw{width:2.2em;height:2.2em;border-radius:50%;flex:none;border:.15em solid rgba(255,255,255,.7)}
.kv{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;font-variant-numeric:tabular-nums}
.kv span{color:var(--ink-dim)}
.field{display:flex;flex-direction:column;gap:.3rem}
.field input{font:inherit;font-size:1.05em;padding:.55em .7em;border-radius:.6rem;border:.1rem solid rgba(255,255,255,.25);background:#0c1830;color:#fff}
.keys{font-family:var(--font-body);color:var(--ink-dim);line-height:1.6}
.keys kbd{background:#0c1830;border:.1rem solid rgba(255,255,255,.25);border-radius:.3rem;padding:0 .35em;font-family:inherit;color:#fff}

@media (max-aspect-ratio: 1/1){
  /* màn hình dọc: đưa ô xu, kim cương về sát trái, dưới thẻ người chơi, để bản đồ tròn không che */
  .money{top:calc(env(safe-area-inset-top,0px) + 6.2rem);left:calc(env(safe-area-inset-left,0px) + .8rem);gap:.5rem}
  .money .pill b{min-width:4.6rem}
  .menu{top:calc(env(safe-area-inset-top,0px) + 11.4rem);right:calc(env(safe-area-inset-right,0px) + .6rem);flex-direction:column;gap:.5rem}
  .quest{top:calc(env(safe-area-inset-top,0px) + 9.4rem);width:15.5rem}
  .hunt{top:calc(env(safe-area-inset-top,0px) + 17.2rem);width:15.5rem}
  .event{top:calc(env(safe-area-inset-top,0px) + 21.2rem)}
  .buffs{top:calc(env(safe-area-inset-top,0px) + 25.8rem)}
  .ctx{bottom:calc(env(safe-area-inset-bottom,0px) + 12.5rem);width:calc(100vw - 2rem)}
  .toasts{top:42%}
}
@media (min-aspect-ratio: 1/1){
  /* xoay ngang: menu nằm dưới thanh tiền, thẻ trạng thái thành hàng ngang, joystick dời sang giữa dưới */
  .menu{top:calc(env(safe-area-inset-top,0px) + 4.7rem);left:calc(env(safe-area-inset-left,0px) + 20.5rem);right:auto;gap:.4rem}
  .mbtn{min-width:3.6rem;font-size:.95rem}
  .mbtn svg{width:2.6rem;height:2.6rem}
  .buffs{top:calc(env(safe-area-inset-top,0px) + 9.6rem);left:calc(env(safe-area-inset-left,0px) + 20.5rem);flex-direction:row;flex-wrap:wrap;width:44rem;gap:.3rem .4rem}
  .joy{left:calc(env(safe-area-inset-left,0px) + 19rem);bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);width:9rem;height:9rem}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* nhãn nổi trong cảnh 3D */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;font-family:var(--font-display)}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;color:#fff}
.lbl.tag{background:rgba(38,33,30,.88);border-radius:.55rem;padding:.2rem .7rem .3rem;text-align:center;font-size:1.05rem;line-height:1.15;margin-top:-.5rem}
.lbl.tag::after{content:"";position:absolute;left:50%;bottom:-.45rem;margin-left:-.45rem;border:.45rem solid transparent;border-top-color:rgba(38,33,30,.88);border-bottom:0}
.lbl.tag b{display:block;font-weight:700}
.lbl.tag .s{display:block;font-size:.88rem;color:var(--ink-dim);font-weight:600}
.lbl.tag .s.gold{color:#ffd84a}.lbl.tag .s.red{color:#ff9f94}
.lbl.tag .pb{display:block;height:.3rem;border-radius:1rem;background:rgba(255,255,255,.2);margin-top:.15rem;overflow:hidden}
.lbl.tag .pb i{display:block;height:100%;width:0;background:var(--ok)}
.lbl.wait{background:#fff;color:#555;border-radius:.5rem;padding:0 .45rem;font-weight:800;font-size:.95rem;line-height:1.3}
.lbl.wait.out{background:var(--danger);color:#fff}
.lbl.name{background:rgba(14,28,52,.72);border-radius:1rem;padding:0 .6rem;font-size:.95rem;font-weight:700}
.lbl.float{font-size:1.4rem;font-weight:800;text-shadow:0 2px 0 rgba(40,25,0,.8),0 0 4px rgba(0,0,0,.6)}
.lbl.bang{display:flex;align-items:center;gap:.4rem}
.lbl.bang i{font-style:normal;width:2.1rem;height:2.3rem;border-radius:50%;background:linear-gradient(#ffe27a,#f2a60c);border:.14rem solid #7a4a06;color:#3a2300;display:grid;place-items:center;font-weight:800;font-size:1.5rem;animation:bob .7s ease-in-out infinite alternate}
.lbl.bang span{background:rgba(38,33,30,.88);border-radius:.5rem;padding:.15rem .6rem;font-weight:700;font-size:1rem}
@keyframes bob{to{transform:translateY(-.4rem)}}
.s.night{color:#d9ccff}
.qbox{display:flex;flex-direction:column;gap:.55rem;background:rgba(255,255,255,.05);border:.1rem solid rgba(255,255,255,.1);border-radius:.8rem;padding:.8rem}
.qbox > b{font-size:1.05em;line-height:1.35;color:#fff}
.qbox p{margin:0;color:var(--ink-dim)}
.qopt{text-align:left;min-height:2.8rem;border-radius:.6rem;background:rgba(18,30,52,.7);border:.12rem solid rgba(159,198,255,.45);color:#eef3fa;font-weight:700;padding:.5rem .8rem;font-size:1rem}
.qopt:active{background:rgba(159,198,255,.25)}
.qbox.ok{border-color:rgba(255,210,63,.6)}
.qbox.no{border-color:rgba(255,159,148,.5)}
.pcard{width:100%;border-radius:.6rem;background:#fff;box-shadow:0 .3rem 1rem rgba(0,0,0,.4)}
button.stamp{font:inherit;color:#fff;border:0;cursor:pointer;padding:0}
.stamp small{font-size:.66em;opacity:.9;font-weight:700}
.stamp.ask{outline-style:solid;outline-color:#ffd23f}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none!important;z-index:9;transition:opacity .35s}
.flash.on{opacity:.9;transition:none}
.buffs [data-open]{pointer-events:auto!important}

/* giao diện kính trong suốt (glassmorphism) */
:root{
  --panel: linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,.10)), rgba(40,90,150,.14);
  --panel-solid: linear-gradient(160deg,rgba(255,255,255,.30),rgba(255,255,255,.06)), rgba(40,90,150,.30);
  --edge: rgba(255,255,255,.75);
}
.pill,.quest,.event,.hunt,.ctx,.toast,.rotate,.sheet,.pinfo,.qbox,.row,.act,.minimap canvas{
  -webkit-backdrop-filter: blur(20px) saturate(190%) brightness(1.08);
  backdrop-filter: blur(20px) saturate(190%) brightness(1.08);
}
.quest,.event,.hunt,.ctx,.pill,.toast,.pinfo{text-shadow:0 1px 2px rgba(10,30,60,.55)}
.pill,.quest,.event,.hunt,.ctx,.toast,.rotate,.sheet,.act{
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 .4rem 1.1rem rgba(20,70,130,.28);
}
.pinfo{background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0))}
.act{background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,.1)), rgba(120,190,255,.22);border-color:rgba(255,255,255,.75)}
.act.on{background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.1)), rgba(255,160,90,.55);border-color:#fff}
.sheet{border-color:rgba(255,255,255,.6)}
.sheet header{background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.04));border-bottom-color:rgba(255,255,255,.25)}
.modal{background:rgba(160,205,240,.22);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.minimap canvas{border-color:rgba(255,255,255,.75)}
.mm-title{background:rgba(24,52,92,.5);border-color:rgba(255,255,255,.5)}
.row{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
.qbox{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
.toast{background:rgba(24,52,92,.5)}
.pill{background:var(--panel)}
.chip{background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.1)),rgba(255,200,61,.6);border:.1rem solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
</style>

/* Vé số: mua trong ngày (tối đa 5 vé), quay số lúc 21:00, trúng thưởng được trả khi game chạy sau giờ quay */
const LOTTO_PRICE = 2000, LOTTO_MAX = 5, LOTTO_HOUR = 21;
const lkey = (dt) => { const d = dt || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function lottoNum(key){ let h = 2166136261; for (const c of key){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return String((h >>> 0) % 100000).padStart(5, '0'); }
function lottoDrawn(d){ return d < lkey() || (d === lkey() && hourNow() >= LOTTO_HOUR); }
function lottoPrize(nums, win){
  let coins = 0, gems = 0;
  nums.forEach(n => {
    if (n === win){ coins += 200000; gems += 20; }
    else if (n.slice(-3) === win.slice(-3)) coins += 20000;
    else if (n.slice(-2) === win.slice(-2)) coins += 2000;
  });
  return { coins, gems };
}
function lottoSettle(){
  const T = S.tickets; if (!T || T.paid || !lottoDrawn(T.date)) return;
  const win = lottoNum('lotto-' + T.date), r = lottoPrize(T.nums, win);
  T.paid = true; T.win = win;
  if (T.nums.length){
    give(r);
    if (r.coins || r.gems){ toast(`Vé số ${T.date} quay được ${win}: trúng ${fmt(r.coins)} xu${r.gems ? ' và ' + r.gems + ' kim cương' : ''}!`, 'gold'); sfx('level'); }
    else toast(`Vé số ${T.date} quay được ${win}: chưa trúng lần này.`, 'bad');
  }
  save();
}
function lottoBuy(){
  lottoSettle();
  if (lottoDrawn(lkey())){ toast('Hôm nay đã quay số. Mai mua tiếp nhé.', 'bad'); return; }
  if (!S.tickets || S.tickets.date !== lkey()) S.tickets = { date: lkey(), nums: [], paid: false };
  if (S.tickets.nums.length >= LOTTO_MAX){ toast(`Mỗi ngày mua tối đa ${LOTTO_MAX} vé.`, 'bad'); return; }
  if (S.coins < LOTTO_PRICE){ toast(`Cần ${fmt(LOTTO_PRICE)} xu để mua vé.`, 'bad'); sfx('bad'); return; }
  S.coins -= LOTTO_PRICE; const n = String(Math.floor(Math.random() * 100000)).padStart(5, '0');
  S.tickets.nums.push(n); toast('Đã mua vé số ' + n, 'gold'); sfx('buy'); save(); renderModal();
}

let AC = null;
function sfx(type){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const notes = type === 'coin' ? [988, 1319] : type === 'level' ? [523, 659, 784, 1047] : type === 'buy' ? [660, 880, 1100] : type === 'bad' ? [220, 180] : [520];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type === 'bad' ? 'square' : 'triangle'; o.frequency.value = f;
      const s0 = t + i * 0.07;
      g.gain.setValueAtTime(0.0001, s0); g.gain.exponentialRampToValueAtTime(type === 'bad' ? 0.04 : 0.1, s0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, s0 + 0.18);
      o.connect(g); g.connect(AC.destination); o.start(s0); o.stop(s0 + 0.2);
    });
  } catch(e){}
}

  setTimeout(() => el.remove(), 2800);
}

const NIGHT_OPEN = 18, NIGHT_CLOSE = 23;
let hourOverride = null;
function hourNow(){ if (hourOverride !== null) return hourOverride; const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
function nightOpenNow(){ const h = hourNow(); return h >= NIGHT_OPEN && h < NIGHT_CLOSE; }
function stallOpen(d){ return !d.night || nightOpenNow(); }
function dayK(){ const h = hourNow(); if (h >= 7 && h < 17) return 1; if (h < 5.5 || h >= 19.5) return 0; if (h < 7) return (h - 5.5) / 1.5; return (19.5 - h) / 2.5; }
function clockChip(){
  const h = hourNow(), hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  const name = h < 5.5 ? 'Ban đêm' : h < 7 ? 'Bình minh' : h < 17 ? 'Ban ngày' : h < 19.5 ? 'Hoàng hôn' : 'Ban đêm';
  return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0') + ' · ' + name;
}
const NIGHT_C = { fog:new THREE.Color(0x1b2843), hemi:new THREE.Color(0x3d5282), sky:new THREE.Color(0x3a4a78), sun:new THREE.Color(0x9fb4ff) };
const DAY_C = { fog:new THREE.Color(0xc9dfee), hemi:new THREE.Color(0xdcecff), sky:new THREE.Color(0xffffff), sun:new THREE.Color(0xfff1d6) };
let lastK = -1;
function applyDayNight(){
  const k = dayK(); if (Math.abs(k - lastK) < 0.003) return; lastK = k;
  sun.intensity = 0.05 + 1.15 * k;
  hemi.intensity = 0.16 + 0.14 * k;
  hemi.color.copy(NIGHT_C.hemi).lerp(DAY_C.hemi, k);
  sun.color.copy(NIGHT_C.sun).lerp(DAY_C.sun, k);
  scene.fog.color.copy(NIGHT_C.fog).lerp(DAY_C.fog, k);
  renderer.toneMappingExposure = 0.5 + 0.24 * k;
  const sk = scene.getObjectByName('sky'); if (sk) sk.material.color.copy(NIGHT_C.sky).lerp(DAY_C.sky, k);
  const stars = scene.getObjectByName('stars'); if (stars) stars.material.opacity = clamp((0.7 - k) / 0.4, 0, 1) * 0.9;

let model = null;
function loadModel(){
  const el = $('loading'), pct = $('loadPct');
  fetch('lam-vien.json').then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const total = +r.headers.get('content-length') || 13300000;
    if (!r.body || !r.body.getReader) return r.arrayBuffer();
    const reader = r.body.getReader(), chunks = []; let got = 0;
    const pump = () => reader.read().then(({ done, value }) => { if (done) return new Blob(chunks).arrayBuffer(); chunks.push(value); got += value.length; pct.textContent = Math.min(99, Math.round(got / total * 100)) + '%'; return pump(); });
    return pump();
  }).then(buf => new Promise((res, rej) => new THREE.GLTFLoader().parse(buf, '', res, rej))).then(g => {
    model = g.scene;
    model.traverse(o => { if (o.isMesh){ const nm = (o.material && o.material.name) || ''; o.castShadow = !/nước|Nhựa|Sơn|Cỏ|Đá sân/.test(nm); o.receiveShadow = true; if (o.material) o.material.envMapIntensity = /Kính|nước|Thép|Xe/.test(nm) ? 0.9 : 0.18; } });

{

  const trunks = new THREE.InstancedMesh(trunkG, lamb('#5c4332'), n);

  const layers = [0, 1, 2, 3].map(() => new THREE.InstancedMesh(coneG, lamb('#ffffff'), n));
  const tc = new THREE.Color();

  return { x, z };
}
function spotFor(zones){
  for (let i = 0; i < 40; i++){
    const zn = pick(zones); let p;
    if (zn === 'steps'){ const L = pick(LANES); p = { x:rand(L[0] + 0.8, L[1] - 0.8), z:rand(19, 43) }; } else p = randomSpot(zn);
    if (blocked(p.x, p.z) || STALLS.some(d => Math.hypot(p.x - d.x, p.z - d.z) < 5)) continue;
    if (items.some(it => Math.hypot(it.x - p.x, it.z - p.z) < 5) || Math.hypot(p.x - P.x, p.z - P.z) < 6) continue;

}

}

function updateItems(dt){

  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i], inn = it.g.userData.inner; it.ph += dt;
    inn.position.y = 1.0 + Math.sin(it.ph * 2.2) * 0.12; inn.rotation.y += dt * (it.type === 'tem' ? 1.6 : 1.1);

    if (t === 'tem') continue;
    if (items.filter(i => i.type === t).length < ITEM_DEF[t].max){ respawnT[t] = (respawnT[t] || 0) + dt; if (respawnT[t] > ITEM_DEF[t].respawn){ respawnT[t] = 0; const p = spotFor(ITEM_DEF[t].zones); if (p) spawnItem(t, -1, p.x, p.z); } }

}

function serveNow(id){

function buyStall(id){
  const d = byId[id], s = st(id); if (s.owned) return;
  if (S.level < d.lv){ toast(`Cần đạt cấp ${d.lv} để mở quầy này.`, 'bad'); sfx('bad'); return; }
  if (S.coins < d.cost){ toast(`Cần ${fmt(d.cost)} xu, bạn còn thiếu ${fmt(d.cost - S.coins)} xu.`, 'bad'); sfx('bad'); return; }
  S.coins -= d.cost; s.owned = true; s.stock = 10; s.level = 1; buildStall(d);
  toast(`Đã mở quầy ${d.name}!`, 'gold'); sfx('buy'); save(); ctxKey = '';
}
function restock(id){
  const d = byId[id], s = st(id), need = maxStock(d) - s.stock;
  if (need <= 0){ toast('Kho đã đầy.'); return; }
  const a = Math.min(need, Math.floor(S.coins / d.ing));
  if (a <= 0){ toast(`Không đủ xu. Mỗi phần nguyên liệu giá ${fmt(d.ing)} xu.`, 'bad'); sfx('bad'); return; }
  S.coins -= a * d.ing; s.stock += a; S.stats.restocks++; toast(`Đã nhập ${a} phần (-${fmt(a * d.ing)} xu)`); sfx('buy'); save();
}

/* ================= NHÀ HÁT HOA DÃ QUỲ (mô hình chi tiết thay khối vòm cũ) ================= */
const OPERA = { x:-41, z:-11, y:8.3, s:0.83, rx:26.4, rz:21.4 };
/* cắt bỏ tam giác của vòm cũ (và sảnh, bụi cây quanh chân vòm) khỏi mô hình quảng trường; giữ nguyên mặt sân */
function cutOldDome(){
  const v = new THREE.Vector3(); let cut = 0;
  model.updateMatrixWorld(true);
  model.traverse(o => {
    if (!o.isMesh || !o.geometry.index) return;
    if (/Đá sân|Cỏ|Nền cắt|Chỉ xám|Nhựa|Sơn kẻ|Mặt nước|Thành bậc|Chữ quảng trường|Xe \|/.test((o.material && o.material.name) || '')) return;
    const pos = deq(o.geometry.attributes.position), ix = o.geometry.index, keep = [], w = new Float32Array(pos.length);
    for (let i = 0; i < pos.length; i += 3){ v.fromArray(pos, i).applyMatrix4(o.matrixWorld); w[i] = v.x; w[i + 1] = v.y; w[i + 2] = v.z; }
    for (let t = 0; t < ix.count; t += 3){
      const a = ix.getX(t) * 3, b = ix.getX(t + 1) * 3, c = ix.getX(t + 2) * 3;
      const x = (w[a] + w[b] + w[c]) / 3, y = (w[a + 1] + w[b + 1] + w[c + 1]) / 3, z = (w[a + 2] + w[b + 2] + w[c + 2]) / 3;
      const ex = (x - OPERA.x) / OPERA.rx, ez = (z - OPERA.z) / OPERA.rz;
      const inside = y > 8.42 && (ex * ex + ez * ez < 1 || (x > -50.3 && x < -31.7 && z > -38 && z < -24.4));
      if (inside) cut++; else keep.push(a / 3, b / 3, c / 3);
    }
    if (keep.length < ix.count) o.geometry.setIndex(keep);
  });
  return cut;
}
function loadOpera(){
  if (!THREE.GLTFLoader) return Promise.reject(new Error('thiếu GLTFLoader'));
  return fetch('nha-hat.json').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => new Promise((res, rej) => new THREE.GLTFLoader().parse(t, '', res, rej))).then(g => {
      const o = g.scene, line = new THREE.LineBasicMaterial({ color:0x0b1512, transparent:true, opacity:0.5 });
      o.scale.setScalar(OPERA.s); o.position.set(OPERA.x, OPERA.y, OPERA.z);
      const drop = [];
      o.traverse(m => {
        if (!m.isMesh) return;
        const nm = (m.material && m.material.name) || '';
        if (/^Đá lát|^Chỉ lát/.test(nm)){ drop.push(m); return; } /* sân lát riêng của mô hình: quảng trường đã có sân */
        m.material.envMapIntensity = 0.35; m.castShadow = /^Kính vàng|^Kính vòm|^Cạnh cánh/.test(nm); m.receiveShadow = false;
        if (/^Kính (vàng|vòm|nhụy)/.test(nm)){ /* kẻ mạch kính bằng nét mảnh thay cho hơn 200 nghìn tam giác nẹp của bản gốc */
          m.material.polygonOffset = true; m.material.polygonOffsetFactor = 1; m.material.polygonOffsetUnits = 1;
          m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 1), line));
        }
      });
      drop.forEach(m => m.parent.remove(m));
      cutOldDome(); scene.add(o);
      /* vùng chặn đi lại theo chân nhà hát mới */
      ELLS[0].rx = 23.6; ELLS[0].rz = 22.4; RECTS[0] = [-51.5, -30.5, -36.6, -25]; CAMB[0].r = 21.5; CAMB[0].top = 23;
    });
}

    h += `<img class="pcard" alt="Ảnh bưu thiếp Đà Lạt" src="${lastPhoto}">`;
    h += '<p>Để lưu ảnh về máy: trên điện thoại hãy giữ ngón tay lên ảnh, trên máy tính hãy bấm chuột phải vào ảnh rồi chọn lưu.</p>';
    h += `<div class="row"><div class="rt"><b>Ảnh bưu thiếp</b><span>Đã chụp ${fmt(S.stats.photos)} ảnh</span></div></div>`;
  } else if (modalType === 'event'){
    const t = now();
    h += '<p><b style="color:#ffe7a0">Giờ vàng chợ đêm</b>: trong 90 giây khách đến gấp đôi và mọi quầy bán giá cao hơn 20%. Mỗi 10 phút được bật một lần.</p>';
    if (!ownedCount()) h += '<p>Hãy mở ít nhất một quầy trước khi bật sự kiện.</p>';
    const btn = eventOn() ? `<button class="gbtn" disabled>Đang diễn ra</button>` : t < S.eventReady ? `<button class="gbtn" disabled>Hồi <span id="evLeft">${mmss(S.eventReady - t)}</span></button>` : `<button class="gbtn" data-act="event" ${ownedCount() ? '' : 'disabled'}>Bắt đầu</button>`;
    h += row('Giờ vàng chợ đêm', eventOn() ? 'Còn ' + mmss(S.eventEnd - t) : 'Khách x2, giá +20%', btn);
    modalTick = () => { const el = $('evLeft'); if (el){ if (now() >= S.eventReady) renderModal(); else el.textContent = mmss(S.eventReady - now()); } };
  }
  b.innerHTML = h;
  const nm = $('optName'); if (nm) nm.addEventListener('input', () => { S.name = nm.value.trim() || 'Chủ Quầy'; });
}
$('mBody').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b || b.disabled) return;
  const [a, id] = b.dataset.act.split(':');
  if (a === 'achv'){ const x = ACHV.find(q => q.id === id); if (x && !S.achv[id] && x.p() >= x.goal){ S.achv[id] = 1; S.gems += x.g; toast(`+${x.g} kim cương`, 'gold'); sfx('buy'); } }
  else if (a === 'daily'){ if (S.lastDaily !== dateKey()){ S.lastDaily = dateKey(); give({ coins:1000 * S.level, gems:10 }); toast(`Quà mỗi ngày: +${fmt(1000 * S.level)} xu, +10 kim cương`, 'gold'); sfx('buy'); } }
  else if (a === 'online'){ if (S.onlineAcc >= 300){ S.onlineAcc = 0; give({ coins:400 * S.level }); toast(`+${fmt(400 * S.level)} xu`, 'gold'); sfx('coin'); } }
  else if (a === 'craft'){ craftRecipe(id); }
  else if (a === 'lottobuy'){ lottoBuy(); }
  else if (a === 'glogin'){ fbLogin(); }
  else if (a === 'glogout'){ fbLogout(); }
  else if (a === 'emailsignup'){ fbSignUp(); }
  else if (a === 'emaillogin'){ fbSignIn(); }
  else if (a === 'emailreset'){ fbReset(); }
  else if (a === 'shop'){ const it = SHOP.find(s => s.id === id); if (it.can && !it.can()){ toast('Bạn cần có ít nhất một quầy.', 'bad'); } else if (S.gems < it.g){ toast(`Cần ${it.g} kim cương. Nhận thêm ở Phúc Lợi và Thành Tựu.`, 'bad'); sfx('bad'); } else { S.gems -= it.g; it.buy(); toast('Đã dùng ' + it.t, 'gold'); sfx('buy'); } }
  else if (a === 'outfit'){ const o = OUTFITS.find(x => x.id === id); if (S.gems < o.price){ toast(`Cần ${o.price} kim cương.`, 'bad'); sfx('bad'); } else { S.gems -= o.price; S.outfits.push(o.id); S.outfit = o.id; setAvatar(); toast('Đã mua ' + o.name, 'gold'); sfx('buy'); } }
  else if (a === 'wear'){ S.outfit = id; setAvatar(); }
  else if (a === 'sound'){ S.sound = !S.sound; if (S.sound) sfx('coin'); bgmSync(); }
  else if (a === 'gfx'){ S.gfx = S.gfx !== 'low' ? 'low' : 'high'; applyGfx(); }
  else if (a === 'reset'){ resetAsk = true; }
  else if (a === 'resetNo'){ resetAsk = false; }
  else if (a === 'resetYes'){ resetGame(); return; }
  else if (a === 'hunt'){ const q = HUNTS.find(x => x.id === id); if (q && !S.hunts[id] && huntP(q) >= q.goal){ S.hunts[id] = 1; give(q.r); toast('Nhận thưởng truy tìm: +' + rewardText(q.r), 'gold'); sfx('level'); } }
  else if (a === 'sell'){ const n = S.inv[id], c = n * ITEM_DEF[id].sell; if (n > 0){ S.inv[id] = 0; S.coins += c; toast(`Đã bán ${n} ${ITEM_DEF[id].name}: +${fmt(c)} xu`, 'gold'); sfx('coin'); } }
  else if (a === 'gift'){ openGift(); }
  else if (a === 'quiz'){ openQuiz(+id); }
  else if (a === 'qa'){ if (!quizRes){ const [qi, qo] = id.split('-').map(Number); const ok = STAMP_QUIZ[qi].ok === qo, r = ok ? { coins:1500, exp:15 } : { coins:300, exp:5 }; S.quiz[qi] = ok ? 1 : 0; quizRes = { ok, r }; give(r); toast(ok ? 'Đúng rồi! +' + rewardText(r) : 'Chưa đúng, vẫn nhận thưởng an ủi: +' + rewardText(r), ok ? 'gold' : ''); sfx(ok ? 'level' : 'coin'); } }
  else if (a === 'qdone'){ closeModal(); }
  else if (a === 'event'){ if (now() >= S.eventReady && ownedCount()){ S.eventEnd = now() + 90000; S.eventReady = now() + 600000; toast('Giờ vàng chợ đêm bắt đầu! Khách x2, giá +20%', 'gold'); sfx('level'); } }
  save(); renderModal(); updateHud();
});
function resetGame(){
  const gfx = S.gfx; S = freshState(); S.gfx = gfx; P.x = S.player.x; P.z = S.player.z; P.h = 0; P.goto = null; people.forEach(q => { q.stall = q.state === 'wander' ? null : q.stall; }); P.sta = 100; yaw = 0;
  STALLS.forEach(d => { RT[d.id].queue.slice().forEach(p => setExit(p)); RT[d.id].queue = []; RT[d.id].prog = 0; buildStall(d); });
  try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem('quayhang-dalat-v2'); } catch(e){}
  pendingQuiz.length = 0; quizRes = null; lastNight = null; ctxKey = ''; setAvatar(); initItems(); closeModal(); toast('Đã bắt đầu lại từ đầu.'); save();
}
$('mClose').addEventListener('click', closeModal);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openModal(b.dataset.open)));
$('btnProfile').addEventListener('click', () => openModal('settings'));
$('btnCoins').addEventListener('click', () => openModal('shop'));
$('btnGems').addEventListener('click', () => openModal('welfare'));
$('btnEvent').addEventListener('click', () => openModal('event'));
$('hunt').addEventListener('click', () => openModal('hunt'));
$('btnBag').addEventListener('click', () => openModal('bag'));
$('btnPhoto').addEventListener('click', takePhoto);
$('btnJump').addEventListener('click', jump);
$('btnRun').addEventListener('click', () => { runOn = !runOn; setRunBtn(); });
$('rotateOk').addEventListener('click', () => { rotateDismissed = true; $('rotate').hidden = true; });

/* ================= Bàn phím & cần điều khiển ================= */
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (!$('modal').hidden){ if (e.code === 'Escape') closeModal(); return; }
  keys[e.code] = true;
  if (e.code === 'Space'){ jump(); e.preventDefault(); }
  if (e.code === 'KeyE') interact();
  if (e.code === 'KeyB') openModal('bag');
  if (e.code === 'KeyP') takePhoto();
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const joy = $('joy'), knob = $('knob'); let jid = null, jc = { x:0, y:0 };
function jmove(e){
  const R = joy.clientWidth * 0.34; let dx = e.clientX - jc.x, dy = e.clientY - jc.y; const d = Math.hypot(dx, dy);
  if (d > R){ dx = dx / d * R; dy = dy / d * R; }
  knob.style.transform = `translate(${dx}px,${dy}px)`; J.x = dx / R; J.y = dy / R;
}
joy.addEventListener('pointerdown', e => { jid = e.pointerId; try { joy.setPointerCapture(jid); } catch(_){} const r = joy.getBoundingClientRect(); jc = { x:r.left + r.width / 2, y:r.top + r.height / 2 }; jmove(e); e.preventDefault(); });
joy.addEventListener('pointermove', e => { if (e.pointerId === jid) jmove(e); });
const jend = e => { if (e.pointerId === jid){ jid = null; J.x = J.y = 0; knob.style.transform = ''; } };
joy.addEventListener('pointerup', jend); joy.addEventListener('pointercancel', jend);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
addEventListener('resize', resize);

/* ================= Khởi động ================= */
function offlineEarnings(){
  const away = Math.min(7200, (now() - (S.savedAt || now())) / 1000); if (away < 30) return;
  let total = 0, n = 0;
  STALLS.forEach(d => { const s = st(d.id); if (!s.owned) return; const k = Math.min(s.stock, Math.floor(away / (serveTime(d) * 4))); if (k > 0){ s.stock -= k; total += lvlPrice(d) * k; n += k; } });
  if (n > 0){ S.coins += total; S.stats.earned += total; S.sold += n; setTimeout(() => toast(`Lúc bạn vắng, các quầy bán được ${n} phần: +${fmt(total)} xu`, 'gold'), 500); }
}
P.y = P.h; resize(); setAvatar(); offlineEarnings(); initItems(); updateCamera(0, true); updateHud();
if (S.quest === 0 && !S.flags.explored) setTimeout(() => toast('Chào mừng tới Quảng trường Lâm Viên! Làm theo bảng Nhiệm vụ chính bên trái.'), 400);
$('buffs').addEventListener('click', e => { const od = e.target.closest('[data-open]'); if (od) openModal(od.dataset.open); });
cloudInit();
window.__game = { items, TPL, S:() => S, P, ready:() => !!model, step:n => { for (let i = 0; i < n; i++) update(0.05); }, people:() => people, set:(o) => Object.assign(P, o), yaw:v => { yaw = v; }, pitch:v => { pitch = v; }, snap:() => updateCamera(0, true), setHour:h => { hourOverride = h; } };
let last = performance.now(), hudAcc = 0, saveAcc = 0;
function frame(ts){
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
  update(dt); updateCamera(dt, false); renderer.render(scene, camera); placeLabels();
  hudAcc += dt; if (hudAcc > 0.12){ hudAcc = 0; updateHud(); updateCtx(); }
  saveAcc += dt; if (saveAcc > 4){ saveAcc = 0; save(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => STALLS.forEach(buildStall));
})();
</script>
