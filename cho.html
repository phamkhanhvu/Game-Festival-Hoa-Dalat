<style>
:root{--font-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;--font:"Be Vietnam Pro",system-ui,sans-serif;--panel:rgba(14,28,52,.62);--edge:rgba(255,255,255,.55);--lime:#c8f03c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9cc6e6;font-family:var(--font);color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;font-weight:700}
.lbl.name{background:rgba(14,28,52,.72);border-radius:1rem;padding:0 .6rem;font-size:.95rem}
.lbl.sign{background:rgba(255,255,255,.92);color:#2b2f3a;border-radius:.7rem;padding:.15rem .6rem;font-size:.9rem;border:2px solid var(--lime);box-shadow:0 .2rem .5rem rgba(0,0,0,.25)}
.lbl.sign.done{border-color:#9aa3ad;opacity:.8}
.lbl.portal{background:rgba(70,30,140,.85);border-radius:1rem;padding:.1rem .7rem;font-size:.95rem;border:2px solid #b89cff}
.lbl.float{font-family:var(--font-display);font-size:1.3rem;text-shadow:0 2px 3px rgba(0,0,0,.6)}
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--font-display)}
#hud > *{position:absolute;pointer-events:auto}
.outline{text-shadow:0 0 3px rgba(0,0,0,.65),0 2px 3px rgba(0,0,0,.45)}
.top{top:calc(env(safe-area-inset-top,0px) + .7rem);left:calc(env(safe-area-inset-left,0px) + .7rem);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 9rem)}
.pill{display:flex;align-items:center;gap:.4rem;height:2.4rem;padding:0 .8rem;background:var(--panel);border:.12rem solid var(--edge);border-radius:2rem;font-size:1.15rem;font-weight:800;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill .lv{background:#ffb400;color:#3a2600;border-radius:.6rem;padding:0 .4rem;font-size:.95rem}
.pill .coin{width:1.2rem;height:1.2rem;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#ffc400 55%,#c88a00);box-shadow:inset 0 0 0 .12rem #b07800}
.place{top:calc(env(safe-area-inset-top,0px) + 3.6rem);left:calc(env(safe-area-inset-left,0px) + .7rem);font-size:1.25rem;font-weight:800;line-height:1.1}
.place small{display:block;font-family:var(--font);font-size:.8rem;font-weight:600;opacity:.9}
.minimap{top:calc(env(safe-area-inset-top,0px) + .6rem);right:calc(env(safe-area-inset-right,0px) + .6rem);width:7.6rem;height:7.6rem;border-radius:50%;overflow:hidden;border:.18rem solid rgba(255,255,255,.85);box-shadow:0 .2rem .6rem rgba(0,0,0,.35);background:#c9c2b5}
.minimap canvas{width:100%;height:100%;display:block}
.joy{left:calc(env(safe-area-inset-left,0px) + 1.4rem);bottom:calc(env(safe-area-inset-bottom,0px) + 1.4rem);width:8.4rem;height:8.4rem;border-radius:50%;background:rgba(255,255,255,.16);border:.15rem solid rgba(255,255,255,.55);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:3.6rem;height:3.6rem;margin:-1.8rem 0 0 -1.8rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bcd9f4 60%,#7fa8cf);box-shadow:0 .2rem .5rem rgba(0,0,0,.35)}
.acts{right:calc(env(safe-area-inset-right,0px) + 1rem);bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);display:flex;gap:.8rem;align-items:flex-end}
.act{width:5rem;height:5rem;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,.1)),rgba(120,190,255,.22);border:.18rem solid rgba(255,255,255,.75);color:#fff;font-family:var(--font-display);font-size:1.05rem;font-weight:800}
.act[aria-pressed="true"]{background:rgba(200,240,60,.5)}
#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 4.2rem);transform:translateX(-50%);display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;z-index:5}
.toast{background:rgba(14,28,52,.86);border:.1rem solid var(--edge);border-radius:1rem;padding:.45rem .9rem;font-weight:700;font-size:.95rem;max-width:88vw;text-align:center;animation:tin .25s ease}
.toast.gold{border-color:#ffd23f;color:#ffe9a0}.toast.bad{border-color:#ff8a80}
@keyframes tin{from{opacity:0;transform:translateY(-.5rem)}}
#card{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);transform:translateX(-50%);width:min(30rem,calc(100vw - 2rem));background:rgba(14,28,52,.9);border:.12rem solid var(--edge);border-radius:1.2rem;padding:1rem 1.1rem;z-index:6;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#card[hidden]{display:none}
#card h3{margin:0 0 .35rem;font-family:var(--font-display);font-size:1.3rem;color:#ffe9a0}
#card p{margin:.2rem 0 .6rem;font-size:.95rem;line-height:1.4;color:#e6edf6}
#card .row{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{border:0;border-radius:.8rem;padding:.6rem 1rem;font-family:var(--font-display);font-size:1.05rem;font-weight:800;color:#24310a;background:var(--lime);box-shadow:0 .2rem 0 #7f9a1f}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.btn:disabled{opacity:.55}
.qopt{display:block;width:100%;text-align:left;margin:.35rem 0;border-radius:.7rem;background:rgba(18,30,52,.7);border:.12rem solid rgba(159,198,255,.45);color:#eef3fa;font-weight:700;padding:.55rem .8rem;font-size:1rem;font-family:var(--font)}
#fade{position:fixed;inset:0;background:radial-gradient(circle,#6a3cc4,#1a0b3a);opacity:0;pointer-events:none;transition:opacity .6s;z-index:9;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.6rem}
#fade.on{opacity:1;pointer-events:auto}
#loading{position:fixed;inset:0;background:linear-gradient(160deg,#20335a,#3c6a96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;z-index:10;text-align:center;padding:1.5rem}

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, clamp = (v, a, b) => v < a ? a : v > b ? b : v, rand = (a, b) => a + Math.random() * (b - a), now = () => Date.now();
const fmt = n => Math.floor(n).toLocaleString('en-US');
const W2 = window.WORLD2;
if (!W2){ $('loadMsg').textContent = 'Không tải được dữ liệu bản đồ. Hãy tải lại trang.'; return; }
const B64 = /claude|anthropic/i.test(location.hostname) || /[?&]b64=1/.test(location.search);
const b64u8 = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
function loadBin(url, onProgress, approx){
  const u = B64 ? url + '.b64.txt' : url;
  return fetch(u).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
    if (!onProgress || !r.body || !r.body.getReader) return r.arrayBuffer();
    const total = +r.headers.get('content-length') || approx * (B64 ? 1.34 : 1), reader = r.body.getReader(), chunks = []; let got = 0;
    const pump = () => reader.read().then(({ done, value }) => { if (done) return new Blob(chunks).arrayBuffer(); chunks.push(value); got += value.length; onProgress(got / total); return pump(); });
    return pump();
  }).then(buf => B64 ? b64u8(new TextDecoder().decode(buf).trim()).buffer : buf);
}
const parseGlb = buf => new Promise((res, rej) => new THREE.GLTFLoader().parse(buf, '', res, rej));
const loadImg = url => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error(url)); im.src = url; });

/* ===== Tiến trình dùng chung với Quảng trường Lâm Viên (cùng ô lưu trên máy) ===== */
const SAVE_KEY = 'quayhang-dalat-v3';
let S = null;
try { S = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e){}
if (!S || typeof S !== 'object') S = { v:5, name:'Chủ Quầy', level:1, exp:0, coins:2000, gems:20, outfit:'blue', flags:{}, stats:{ earned:0 } };
S.cho = S.cho && typeof S.cho === 'object' ? S.cho : {}; S.cho.ck = S.cho.ck || {};
S.flags = S.flags || {}; S.stats = S.stats || { earned:0 };
function save(){ try { S.savedAt = now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }
const expNeed = l => Math.round(60 * Math.pow(l, 1.4));
function give(r){
  if (r.coins){ S.coins = (S.coins || 0) + r.coins; }
  if (r.gems) S.gems = (S.gems || 0) + r.gems;
  if (r.exp){ S.exp = (S.exp || 0) + r.exp; while (S.exp >= expNeed(S.level)){ S.exp -= expNeed(S.level); S.level++; S.gems = (S.gems || 0) + 5; toast(`Lên cấp ${S.level}! +5 kim cương`, 'gold'); } }
  hud(); save();
}
const rewardText = r => [r.coins ? fmt(r.coins) + ' xu' : '', r.gems ? r.gems + ' kim cương' : '', r.exp ? r.exp + ' EXP' : ''].filter(Boolean).join(', ');
function hud(){ $('hLv').textContent = 'Lv.' + (S.level || 1); $('hName').textContent = S.name || 'Chủ Quầy'; $('hCoins').textContent = fmt(S.coins || 0); }
function toast(msg, kind){ const box = $('toasts'), el = document.createElement('div'); el.className = 'toast' + (kind ? ' ' + kind : ''); el.textContent = msg; box.appendChild(el); while (box.children.length > 3) box.firstChild.remove(); setTimeout(() => el.remove(), 3000); }
hud();

/* ===== Lưới đi lại ===== */
const GR = (() => { const h = new Int16Array(b64u8(W2.h).buffer), top = new Int16Array(b64u8(W2.top).buffer); return { nx:W2.nx, nz:W2.nz, x0:W2.x0, z0:W2.z0, cs:W2.step, h, top }; })();
function groundAt(x, z){
  const fx = (x - GR.x0) / GR.cs, fz = (z - GR.z0) / GR.cs, i = Math.floor(fx), j = Math.floor(fz);
  if (i < 0 || j < 0 || i >= GR.nx - 1 || j >= GR.nz - 1) return NaN;
  const a = j * GR.nx + i, b = a + 1, c = a + GR.nx, d = c + 1, H = GR.h;
  if (H[a] === -32768 || H[b] === -32768 || H[c] === -32768 || H[d] === -32768) return NaN;
  const u = fx - i, v = fz - j;
  return ((H[a] * (1 - u) + H[b] * u) * (1 - v) + (H[c] * (1 - u) + H[d] * u) * v) * 0.01;
}
function topAt(x, z){ const i = Math.round((x - GR.x0) / GR.cs), j = Math.round((z - GR.z0) / GR.cs); if (i < 0 || j < 0 || i >= GR.nx || j >= GR.nz) return 0; return GR.top[j * GR.nx + i] * 0.01; }
const MAX_SLOPE = 1.5;
function stepOk(x, z, nx, nz){ const cur = groundAt(x, z), nh = groundAt(nx, nz); if (nh !== nh) return false; return !(cur === cur && Math.abs(nh - cur) > MAX_SLOPE * Math.hypot(nx - x, nz - z) + 0.02); }
const P = { x:W2.spawn.x, z:W2.spawn.z, h:W2.spawn.y, y:W2.spawn.y, ang:Math.PI, walk:0, moving:false, vy:0 };
function movePlayer(dx, dz){
  const dist = Math.hypot(dx, dz), n = Math.max(1, Math.ceil(dist / 0.2)), sx = dx / n, sz = dz / n;
  for (let i = 0; i < n; i++){
    if (stepOk(P.x, P.z, P.x + sx, P.z + sz)){ P.x += sx; P.z += sz; }
    else if (Math.abs(sx) > 1e-5 && stepOk(P.x, P.z, P.x + sx, P.z)) P.x += sx;
    else if (Math.abs(sz) > 1e-5 && stepOk(P.x, P.z, P.x, P.z + sz)) P.z += sz;
    else break;
  }
}

/* ===== Đồ họa ===== */
const cv = $('cv');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true, powerPreference:'high-performance' }); }
catch(e){ $('loadMsg').textContent = 'Trình duyệt này không bật được đồ họa 3D (WebGL).'; return; }
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.8;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9cc6e6); scene.fog = new THREE.Fog(0xb8d3e8, 120, 520);
const camera = new THREE.PerspectiveCamera(55, 1, 0.3, 1200);
const C = hex => new THREE.Color(hex).convertSRGBToLinear();
const hemi = new THREE.HemisphereLight(0xdcecff, 0x8a8370, 0.55); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 1.15); sun.position.set(-60, 120, 40); scene.add(sun);
let W = 0, H = 0;
function resize(){ W = innerWidth; H = innerHeight; renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
function canvasTex(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; }
/* bóng tròn dưới chân nhân vật (cảnh lớn nên không bật đổ bóng toàn cảnh) */
const blob = new THREE.Mesh(new THREE.CircleGeometry(0.5, 20), new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.28, depthWrite:false }));
blob.rotation.x = -Math.PI / 2; scene.add(blob);

/* ===== Nhân vật ===== */
const OUTFITS = [
  { id:'blue',   name:'Áo khoác đỏ gạch', color:'#9e3d33', price:0 },
  { id:'red',    name:'Áo len đỏ',     color:'#c4453a', price:25 },
  { id:'yellow', name:'Áo len vàng',   color:'#d9a322', price:25 },
  { id:'purple', name:'Hoodie tím',    color:'#7a55c0', price:25 },
  { id:'green',  name:'Áo khoác rêu',  color:'#4f7a3c', price:25 },
];
let playerMesh = new THREE.Group();
{ const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 1.6, 10), new THREE.MeshLambertMaterial({ color:C('#9e3d33') })); body.position.y = 0.85; playerMesh.add(body); }
scene.add(playerMesh);
const JACKET_BASE = '#86362a';
function buildSkinned(sc, img){
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body); body.add(sc);
  const pc = document.createElement('canvas'); pc.width = img.naturalWidth; pc.height = img.naturalHeight; const px2 = pc.getContext('2d'); px2.drawImage(img, 0, 0);
  const pix = px2.getImageData(0, 0, pc.width, pc.height).data;
  const tex = new THREE.Texture(img); tex.encoding = THREE.sRGBEncoding; tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false; tex.needsUpdate = true;
  const jackets = [];
  sc.traverse(o => {
    if (!o.isSkinnedMesh) return;
    o.frustumCulled = false; o.castShadow = true;
    o.geometry.computeVertexNormals();                      /* pháp tuyến mượt trước khi tách đỉnh theo từng tam giác */
    /* tách đỉnh theo từng tam giác (tự làm, giữ nguyên kiểu dữ liệu và cờ normalized của trọng số xương) */
    const src = o.geometry, ix = src.index, N = ix ? ix.count : src.attributes.position.count, ge = new THREE.BufferGeometry(), GET = ['getX', 'getY', 'getZ', 'getW'];
    for (const k in src.attributes){
      const a = src.attributes[k], sz = a.itemSize, A = a.isInterleavedBufferAttribute ? a.data.array : a.array, out = new A.constructor(N * sz);
      for (let i = 0; i < N; i++){ const v = ix ? ix.getX(i) : i; for (let c = 0; c < sz; c++) out[i * sz + c] = a[GET[c]](v); }
      ge.setAttribute(k, new THREE.BufferAttribute(out, sz, a.normalized));
    }
    o.geometry = ge;
    const pos = ge.attributes.position, n = pos.count;
    let y0 = 1e9, y1 = -1e9, x0 = 1e9, x1 = -1e9;
    for (let v = 0; v < n; v++){ const y = pos.getY(v), x = pos.getX(v); if (y < y0) y0 = y; if (y > y1) y1 = y; if (x < x0) x0 = x; if (x > x1) x1 = x; }
    /* mặt phẳng lưng: giữa bề dày của chân (thân người) và điểm lùi sau nhất (ba lô) */
    let zb = 1e9, zl0 = 1e9, zl1 = -1e9;
    for (let v = 0; v < n; v++){ const z = pos.getZ(v); if (z < zb) zb = z; if ((pos.getY(v) - y0) / (y1 - y0) < 0.4){ if (z < zl0) zl0 = z; if (z > zl1) zl1 = z; } }
    const zPack = zl0 + (zb - zl0) * 0.35, clampN = (v, a, b) => v < a ? a : v > b ? b : v;
    const uv = new Float32Array(n * 2), ca = new Float32Array(n * 3).fill(1), jk = [];
    for (let t = 0; t < n; t += 3){
      /* tam giác quay mặt về phía trước (+z) dùng nửa ảnh mặt trước, còn lại dùng nửa ảnh mặt sau */
      const ax = pos.getX(t + 1) - pos.getX(t), ay = pos.getY(t + 1) - pos.getY(t), bx = pos.getX(t + 2) - pos.getX(t), by = pos.getY(t + 2) - pos.getY(t);
      const front = ax * by - ay * bx > 0;
      /* khối ba lô nhô ra sau lưng: cả mặt bên cũng lấy màu ba lô thay vì màu áo */
      const cz = (pos.getZ(t) + pos.getZ(t + 1) + pos.getZ(t + 2)) / 3, cty = ((pos.getY(t) + pos.getY(t + 1) + pos.getY(t + 2)) / 3 - y0) / (y1 - y0), pack = cz < zPack && cty > 0.5 && cty < 0.82;
      for (let v = t; v < t + 3; v++){
        let fu = (pos.getX(v) - x0) / (x1 - x0), w = 0.003 + 0.994 * (pos.getY(v) - y0) / (y1 - y0);
        if (pack){ fu = clampN(fu, 0.35, 0.73); w = clampN(w, 0.555, 0.765); }
        const u = 0.006 + 0.488 * fu + (front && !pack ? 0 : 0.5);
        uv[v * 2] = u; uv[v * 2 + 1] = w;
        const pi = (Math.min(pc.height - 1, Math.floor((1 - w) * pc.height)) * pc.width + Math.min(pc.width - 1, Math.floor(u * pc.width))) * 4;
        if (pix[pi] > 85 && pix[pi + 1] < 95 && pix[pi] > pix[pi + 1] * 1.6) jk.push(v);   /* điểm ảnh màu đỏ gạch = áo khoác */
      }
    }
    ge.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); ge.setAttribute('color', new THREE.BufferAttribute(ca, 3)); o.normalizeSkinWeights();
    o.material = new THREE.MeshLambertMaterial({ map:tex, vertexColors:true, skinning:true });
    jackets.push({ attr:ge.attributes.color, idx:jk });
  });
  sc.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(sc); sc.scale.multiplyScalar(1.78 / (box.max.y - box.min.y)); sc.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(sc); sc.position.y -= box.min.y; sc.position.x -= (box.min.x + box.max.x) / 2; sc.position.z -= (box.min.z + box.max.z) / 2;
  g.updateMatrixWorld(true);
  /* mỗi xương xoay quanh trục trái-phải của nhân vật, quy về hệ toạ độ riêng của xương */
  const bones = {}, wq = new THREE.Quaternion(), XA = new THREE.Vector3(1, 0, 0), qt = new THREE.Quaternion();
  sc.traverse(o => { if (o.isBone){ o.getWorldQuaternion(wq); bones[o.name] = { b:o, rest:o.quaternion.clone(), axis:XA.clone().applyQuaternion(wq.clone().invert()).normalize() }; } });
  const swing = (name, ang) => { const e = bones[name]; if (!e) return; qt.setFromAxisAngle(e.axis, ang); e.b.quaternion.copy(e.rest).multiply(qt); };
  const px = () => ({ rotation:{ x:0 } }), u = { real:true, body, by:0, amp:0.55, legL:px(), legR:px(), armL:px(), armR:px(), shirt:[1] };
  u.pose = () => {
    const l = u.legL.rotation.x, r = u.legR.rotation.x, al = u.armL.rotation.x, ar = u.armR.rotation.x;
    swing('LeftUpLeg', l); swing('LeftLeg', Math.max(0, l) * 1.3 + Math.abs(l) * 0.12); swing('RightUpLeg', r); swing('RightLeg', Math.max(0, r) * 1.3 + Math.abs(r) * 0.12);
    swing('LeftArm', al * 0.7); swing('LeftForeArm', -0.15 - Math.max(0, -al) * 0.45); swing('RightArm', ar * 0.7); swing('RightForeArm', -0.15 - Math.max(0, -ar) * 0.45);
  };
  /* đổi màu áo khoác theo trang phục đã mua (nhân màu lên phần áo đỏ của ảnh); null = màu gốc */
  const jb = C(JACKET_BASE);
  u.recolor = hex => { const c = hex ? C(hex) : null, r = c ? Math.min(3, c.r / jb.r) : 1, gg = c ? Math.min(3, c.g / jb.g) : 1, bb = c ? Math.min(3, c.b / jb.b) : 1;
    jackets.forEach(j => { const a = j.attr.array; for (const v of j.idx){ a[v * 3] = r; a[v * 3 + 1] = gg; a[v * 3 + 2] = bb; } j.attr.needsUpdate = true; }); };
  u.pose(); g.userData = u; return g;
}

function animPerson(mesh, walk, moving){
  const u = mesh.userData; if (!u || !u.real) return; const s = moving ? Math.sin(walk) : 0, a = u.amp;
  u.legL.rotation.x = s * a; u.legR.rotation.x = -s * a; u.body.position.y = u.by + (moving ? Math.abs(Math.cos(walk)) * 0.03 : 0); u.body.rotation.z = moving ? Math.cos(walk) * 0.025 : 0;
  u.armL.rotation.x = -s * a * 1.1; u.armR.rotation.x = s * a * 1.1; if (u.pose) u.pose();
}
const lerpAng = (a, b, k) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return a + d * k; };

    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 6; for (let k = 0; k < 4; k++){ c.beginPath(); for (let t = 0; t < 1; t += 0.02){ const a = t * 5 + k * Math.PI / 2, r = t * w * 0.45; c.lineTo(w / 2 + Math.cos(a) * r, h / 2 + Math.sin(a) * r); } c.stroke(); } });

  scene.add(g.scene); $('loading').hidden = true;
  if (!S.cho.seen){ S.cho.seen = 1; setTimeout(() => toast('Chào mừng tới Chợ Đà Lạt! Check-in 5 điểm nổi tiếng và săn thẻ Đố Vui giấu quanh chợ.', 'gold'), 600); save(); }
  return Promise.all([loadBin('character.glb').then(parseGlb), loadImg('character.jpg')]).then(([c, img]) => {
    const k = buildSkinned(c.scene, img); k.position.copy(playerMesh.position); k.rotation.y = playerMesh.rotation.y; k.scale.setScalar(1.06);
    scene.remove(playerMesh); playerMesh = k; scene.add(k);
    const o = OUTFITS.find(x => x.id === S.outfit) || OUTFITS[0]; if (k.userData.recolor) k.userData.recolor(o.id === 'blue' ? null : o.color);
  }).catch(e => console.warn('nhân vật', e));
}).catch(e => { console.error(e); $('loadMsg').textContent = 'Không tải được bản đồ Chợ Đà Lạt (' + e.message + '). Hãy tải lại trang.'; });

/* ===== Vòng lặp ===== */
let last = performance.now(), T = 0, dnT = 0;
yaw = P.ang + Math.PI;
function update(dt){
  T += dt;
  let ix = J.x + ((keys.d || keys.arrowright) ? 1 : 0) - ((keys.a || keys.arrowleft) ? 1 : 0), iz = J.y + ((keys.s || keys.arrowdown) ? 1 : 0) - ((keys.w || keys.arrowup) ? 1 : 0);
  const mag = Math.min(1, Math.hypot(ix, iz)); P.moving = mag > 0.12 && !QZ.cur;
  if (P.moving){
    const sp = (running || keys.shift ? 9.5 : 5.2) * mag, a = Math.atan2(ix, iz) + yaw + Math.PI, wx = Math.sin(a), wz = Math.cos(a);
    movePlayer(wx * sp * dt, wz * sp * dt); P.walk += dt * (running ? 15 : 9.5); P.ang = lerpAng(P.ang, Math.atan2(wx, wz), 1 - Math.pow(0.0001, dt));
  }
  const g = groundAt(P.x, P.z); if (g === g){ P.h = g; P.y += (g - P.y) * Math.min(1, dt * 18); }
  playerMesh.position.set(P.x, P.y, P.z); playerMesh.rotation.y = P.ang; animPerson(playerMesh, P.walk, P.moving);
  blob.position.set(P.x, P.y + 0.03, P.z);
  /* cổng: phải bước ra xa một lần rồi mới kích hoạt, tránh vừa tới đã bị đẩy về */
  const pd = Math.hypot(P.x - PORTAL.x, P.z - PORTAL.z);
  if (pd > 4) portalArmed = true; if (portalArmed && pd < 1.3 && !leaving) goHome();
  const u = portal.userData; u.disc.rotation.z -= dt * 1.6; u.glow.material.opacity = 0.35 + Math.sin(T * 3) * 0.15; u.ring.scale.setScalar(1 + Math.sin(T * 2) * 0.03);
  nearCk = null; let bd = 3.6; CKS.forEach(c => { const d = Math.hypot(P.x - c.x, P.z - c.z); if (d < bd && Math.abs(P.h - c.y) < 2){ bd = d; nearCk = c; } });
  updateCards(dt); updateCard();
  for (let i = floats.length - 1; i >= 0; i--){ const f = floats[i]; f.life -= dt; f.y += dt * 0.8; f.el.style.opacity = Math.min(1, f.life); if (f.life <= 0){ f.el.remove(); floats.splice(i, 1); } }
  dnT -= dt; if (dnT <= 0){ dnT = 20; dayNight(); }
}
function frame(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt);
  desiredCam(camTgt); camPos.lerp(camTgt, 1 - Math.pow(0.0005, dt)); camera.position.copy(camPos); camera.lookAt(P.x, P.y + 2.0, P.z);
  sun.position.set(P.x - 60, 120, P.z + 40); sun.target.position.set(P.x, 0, P.z); sun.target.updateMatrixWorld();
  renderer.render(scene, camera);
  place(nameLbl, P.x, P.y + 2.05, P.z, 60); place(portalLbl, PORTAL.x, PORTAL.y + 3.6, PORTAL.z, 90);
  CKS.forEach(c => place(c.lbl, c.x, c.y + 2.9, c.z, 70));
  floats.forEach(f => place(f.el, f.x, f.y, f.z, 80));
  drawMini();
  requestAnimationFrame(frame);
}
desiredCam(camTgt); camPos.copy(camTgt);
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
window.__cho = { P, S:() => S, groundAt, CKS, QZ, goHome, step:n => { for (let i = 0; i < n; i++) update(0.05); }, set:o => Object.assign(P, o), yaw:v => { yaw = v; }, pitch:v => { pitch = v; }, dist:v => { camDist = v; } };
})();
</script>
